<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置</title>
<style>
  /* 独立浮窗：贴在卡片外侧，不挡卡片本身。
     待办卡收起时只有几十像素高，把设置塞进去必然看不清，所以整块搬出来。
     窗口拖动由 JS 自己实现（不用 -webkit-app-region，它会吃掉滑块）。 */
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent; overflow:hidden;
    font-family:-apple-system,"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
    color:#fff; cursor:default; user-select:none;
  }
  .box{
    /* ★ 不要整块设 drag：那样滑块会被窗口拖拽区吃掉，拖不动（实测）。
       只有标题栏 .hdr 是拖动区。 */
    position:absolute; inset:0;
    border-radius:14px;
    background:rgba(16,20,28,.97);
    box-shadow:0 8px 26px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.09);
    padding:9px 12px 9px;
    display:flex; flex-direction:column; gap:7px;
  }
  body.light .box{
    background:rgba(252,252,252,.99);
    color:#111;
    box-shadow:0 8px 26px rgba(0,0,0,.16), inset 0 0 0 1px rgba(0,0,0,.07);
  }
  /* ★ 不用 -webkit-app-region 了：它会把同一区域内的滑块一起吃掉，
     用户实测"滑块拉不动"。改成顶部一条自己实现的手动拖动条
     （mousedown → 通知主进程跟系统光标搬窗口）。 */
  .dragbar{
    position:absolute; left:-12px; right:-12px; top:-9px; height:30px;
    border-radius:14px 14px 0 0;
    z-index:1; cursor:grab;
  }
  h4{ margin:0 0 0 22px; font-size:11px; font-weight:600; letter-spacing:.4px;
      color:rgba(255,255,255,.55); }
  body.light h4{ color:rgba(0,0,0,.5); }

  .back, .x{
    position:absolute; top:8px; z-index:2; width:16px; height:16px; border:0; padding:0;
    border-radius:50%; background:rgba(255,255,255,.08); color:rgba(255,255,255,.7);
    font-size:12px; line-height:1; cursor:pointer; display:grid; place-items:center;
  }
  .back{ left:8px; }
  .x{ right:8px; font-size:13px; }
  .back:hover, .x:hover{ background:rgba(255,255,255,.2); color:#fff; }
  body.light .back, body.light .x{ background:rgba(0,0,0,.07); color:rgba(0,0,0,.55); }
  body.light .back:hover, body.light .x:hover{ background:rgba(0,0,0,.14); color:#111; }

  .row{
    display:flex; align-items:center; gap:8px; height:24px; font-size:11px;
  }
  .row > span{ flex:0 0 44px; color:rgba(255,255,255,.7); }
  body.light .row > span{ color:rgba(0,0,0,.62); }
  .row b{ flex:0 0 44px; text-align:right; font-weight:500; color:rgba(255,255,255,.5);
          font-variant-numeric:tabular-nums; }
  body.light .row b{ color:rgba(0,0,0,.45); }

  input[type=range]{
    flex:1 1 auto; min-width:0; height:4px; -webkit-appearance:none; appearance:none;
    background:rgba(255,255,255,.16); border-radius:2px; outline:none; cursor:pointer;
  }
  body.light input[type=range]{ background:rgba(0,0,0,.14); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#9CB4D8; box-shadow:0 1px 3px rgba(0,0,0,.4); cursor:grab;
  }

  .chk{
    display:flex; align-items:center; gap:7px; height:24px; font-size:11px;
    color:rgba(255,255,255,.8); cursor:pointer;
  }
  body.light .chk{ color:rgba(0,0,0,.75); }
  .chk input{ width:13px; height:13px; margin:0; accent-color:#9CB4D8; cursor:pointer; }
  .tip{ font-size:10px; color:rgba(255,255,255,.35); margin:-2px 0 0 22px; }
  body.light .tip{ color:rgba(0,0,0,.35); }
</style>
</head>
<body>
  <div class="box">
    <div class="dragbar"></div>
    <h4>设置</h4>
    <button class="back" id="back" title="返回">‹</button>
    <button class="x" id="x" title="关闭">×</button>

    <label class="row"><span>透明度</span><input id="a" type="range" min="6" max="94" step="1"><b id="av"></b></label>
    <label class="row"><span>宽度</span><input id="w" type="range" min="240" max="480" step="4"><b id="wv"></b></label>
    <div class="tip">窄一点文字刚好，不会拖一条长尾巴</div>
    <label class="row"><span>缩放</span><input id="z" type="range" min="80" max="160" step="2"><b id="zv"></b></label>
    <div class="tip">整张卡连字号一起放大缩小</div>
    <label class="chk"><input type="checkbox" id="full"><span>完全体（整张卡常驻）</span></label>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  document.body.classList.toggle("light", (window.st && window.st.theme) === "light");

  let cur = { alpha: 0.56, width: 320, scale: 1, full: 0 };
  let tA = 0, tW = 0, tZ = 0;

  function paint() {
    $("a").value = String(Math.round((1 - cur.alpha) * 100));
    $("av").textContent = Math.round((1 - cur.alpha) * 100) + "%";
    $("w").value = String(cur.width);
    $("wv").textContent = cur.width + "px";
    $("z").value = String(Math.round(cur.scale * 100));
    $("zv").textContent = Math.round(cur.scale * 100) + "%";
    $("full").checked = !!cur.full;
  }
  function push() {
    window.st.set({ alpha: cur.alpha, width: cur.width, scale: cur.scale, full: cur.full ? 1 : 0 });
  }

  /* 滑杆拖动中就生效（60ms 节流），松手再补一次 */
  $("a").addEventListener("input", () => {
    cur.alpha = Math.min(0.94, Math.max(0.06, 1 - Number($("a").value) / 100));
    $("av").textContent = Math.round((1 - cur.alpha) * 100) + "%";
    if (tA) return;
    tA = setTimeout(() => { tA = 0; push(); }, 60);
  });
  $("a").addEventListener("change", () => { if (tA) { clearTimeout(tA); tA = 0; } push(); });

  $("w").addEventListener("input", () => {
    cur.width = Math.round(Number($("w").value));
    $("wv").textContent = cur.width + "px";
    if (tW) return;
    tW = setTimeout(() => { tW = 0; push(); }, 100);
  });
  $("w").addEventListener("change", () => { if (tW) { clearTimeout(tW); tW = 0; } push(); });

  $("z").addEventListener("input", () => {
    cur.scale = Math.round(Number($("z").value)) / 100;
    $("zv").textContent = Math.round(cur.scale * 100) + "%";
    if (tZ) return;
    tZ = setTimeout(() => { tZ = 0; push(); }, 100);
  });
  $("z").addEventListener("change", () => { if (tZ) { clearTimeout(tZ); tZ = 0; } push(); });

  $("full").addEventListener("change", () => { cur.full = $("full").checked ? 1 : 0; push(); });

  /* 顶部拖动条：按下 → 主进程跟系统光标搬窗口；松开结束 */
  (function () {
    const bar = document.querySelector(".dragbar");
    if (!bar) return;
    bar.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      try { window.st.dragBegin(); } catch (er) {}
    });
    const end = () => { try { window.st.dragEnd(); } catch (er) {} };
    window.addEventListener("mouseup", end);
    window.addEventListener("blur", end);
  })();

  $("back").addEventListener("click", () => window.st.close());
  $("x").addEventListener("click", () => window.st.close());

  paint();
  window.st.get().then((v) => {
    if (!v) return;
    cur.alpha = Number(v.alpha) || 0.56;
    cur.width = Number(v.width) || 320;
    cur.scale = Number(v.scale) || 1;
    cur.full = v.full ? 1 : 0;
    paint();
  }).catch(() => {});
</script>
</body>
</html>
