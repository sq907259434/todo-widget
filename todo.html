<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>待办卡片</title>
<style>
  :root{
    --g1:#26304a; --g2:#3d4a68; --g3:#5a688a;
    --ink:#fff;
    --ink-2:rgba(255,255,255,.72);
    --ink-3:rgba(255,255,255,.46);
    --danger:#ff5a5f;
    --green:#3ecf6b;
    /* 外观滑杆：--a 底色浓度（透明度滑杆的倒数）、--frost 磨砂模糊半径 */
    --a:.56;
    --frost:0px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
    cursor:default;
    user-select:none;
  }

  /* ---------- 桌面快照背景 ----------
     卡片半透明的地方垫的就是它：主进程按窗口位置从桌面快照里裁一块推过来，
     所以"透出来"的是真图标（真透明在桌面层里只透壁纸）。
     尺寸/位置由 JS 按主进程给的 left/top/w/h 设置，图就是那一块的 1:1 拷贝。 */
  #bd{
    position:absolute; z-index:0; pointer-events:none;
    background-repeat:no-repeat; background-size:100% 100%;
    filter:blur(var(--frost));
    opacity:0; transition:opacity .16s ease;
  }
  body.has-bd #bd{ opacity:1; }
  /* 真透明模式：窗口不再裁剪区域，背景由系统真实混合 ——
     这时再把桌面快照画上去，反而是"假背景"盖住了真背景，所以要关掉。 */
  body.noreg #bd{ display:none; }
  /* 真透明模式下磨砂滑杆是空转的：它模糊的是 #bd 快照，而快照已经不画了。
     系统 acrylic 又要求窗口不透明，两者不可兼得 —— 直接把滑杆置灰。 */
  body.noreg .lkrow.frost{ opacity:.35; pointer-events:none; }
  body.noreg .lkrow.frost::after{
    content:"真透明模式下不可用"; display:block; font-size:9px;
    color:rgba(255,255,255,.4); margin-left:auto;
  }
  /* 拖动中不藏快照：主进程在起拖时抓了一张"无卡片"的干净全屏快照，
     拖动中按新位置实时重裁推送（见 main.js dragBegin）。必须垫着它 ——
     窗口被 region 裁剪后，半透明像素合成不出透明度，一旦快照层缺席，
     条目的半透明底就会直接和黑底混合，整条变黑（用户报的"拖动黑条"）。 */

  /* ---------- 卡片 ---------- */
  .card{
    position:absolute; inset:0;
    border-radius:10px;
    padding:11px 15px 9px;
    display:flex; flex-direction:column;
    overflow:hidden;

    background-image:linear-gradient(160deg,
      rgba(38,48,74,var(--a)) 0%,
      rgba(61,74,104,var(--a)) 52%,
      rgba(90,104,138,var(--a)) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.30),
      inset 0 0 0 1px rgba(255,255,255,.16);

    /* 拖动由页面自己接管（见文件末尾"拖动窗口"）：桌面层模式下窗口是 Progman
       的子窗口，系统非客户区拖动不生效，所以这里绝不能是 drag —— 一旦是 drag，
       Chromium 会把鼠标事件吞给系统，页面连 mousedown 都收不到。 */
    -webkit-app-region: no-drag;
  }
  body.acrylic .card{
    background-image:none;
    background-color:transparent;
  }

  /* 叠加色只留一点点光泽：底色浓度已经由 --a 管了，这里再叠满会把滑杆的效果吃掉 */
  .card .tint{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(160deg,
      color-mix(in srgb, var(--g1) calc(var(--a) * 30%), transparent) 0%,
      color-mix(in srgb, var(--g2) calc(var(--a) * 26%), transparent) 52%,
      color-mix(in srgb, var(--g3) calc(var(--a) * 24%), transparent) 100%);
  }
  .card::after{
    content:""; position:absolute; left:-10%; right:-10%; top:-58%; height:76%; z-index:2;
    background:radial-gradient(60% 100% at 50% 100%, rgba(255,255,255,.18), transparent 70%);
    pointer-events:none;
  }
  .card > .hd, .card > .add, .card > .list, .card > .ft{
    position:relative; z-index:3;
  }

  /* ---------- 顶栏 ---------- */
  /* 顶栏就是这张卡的标题栏：按住这里拖窗口，鼠标保持箭头（跟资源管理器、
     浏览器标签栏一样）。别处不给拖动提示，条文也不会变成"抓手"。
     这里不能用 -webkit-app-region: drag —— 见 .card 上那段说明。 */
  .hd{
    height:22px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    -webkit-app-region: no-drag;
    cursor: default;
  }
  .ttl{
    display:flex; align-items:baseline; gap:6px;
    font-size:14px; font-weight:600; letter-spacing:.2px;
  }
  .ttl .cnt{
    font-size:10.5px; font-weight:500; color:var(--ink-3); letter-spacing:.3px;
  }
  .acts{ display:flex; align-items:center; gap:2px; -webkit-app-region:no-drag; }
  .act{
    width:24px; height:24px; border:0; padding:0; border-radius:50%;
    background:transparent; color:var(--ink-2); cursor:pointer;
    display:grid; place-items:center;
    opacity:.34; transition:opacity .2s ease, background .15s ease, transform .15s ease;
  }
  .card:hover .act{ opacity:.95; }
  .act:hover{ background:rgba(255,255,255,.16); color:#fff; }
  .act:active{ transform:scale(.88); }
  .act svg{ width:13px; height:13px; }
  /* 历史视图时按钮保持点亮，提示"正在看历史" */
  .act.on{ background:rgba(255,255,255,.22); color:#fff; opacity:1; }

  /* ---------- 输入 ---------- */
  .add{
    flex:0 0 auto; height:32px;
    display:flex; align-items:center; gap:6px;
    margin:7px 0 2px;
    -webkit-app-region:no-drag;
  }
  .add input{
    flex:1 1 auto; min-width:0; height:32px;
    border:0; outline:0; border-radius:10px;
    padding:0 10px; font-size:12.5px; font-family:inherit;
    color:#fff; background:rgba(255,255,255,.13);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
    transition:background .16s ease, box-shadow .16s ease;
  }
  .add input::placeholder{ color:rgba(255,255,255,.40); }
  .add input:focus{
    background:rgba(255,255,255,.19);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.32);
  }
  .btn-add{
    flex:0 0 auto; width:32px; height:32px;
    border:0; border-radius:10px; padding:0; cursor:pointer;
    background:rgba(255,255,255,.16); color:#fff;
    display:grid; place-items:center;
    transition:background .15s ease, transform .12s ease, opacity .15s ease;
  }
  .btn-add:hover{ background:rgba(255,255,255,.26); }
  .btn-add:active{ transform:scale(.92); }
  .btn-add:disabled{ opacity:.32; cursor:default; transform:none; background:rgba(255,255,255,.10); }
  .btn-add svg{ width:14px; height:14px; }

  /* ---------- 列表 ---------- */
  .list{
    flex:1 1 auto; min-height:0;
    margin:5px -4px 0;
    padding:0 4px;
    overflow-y:auto; overflow-x:hidden;
    overflow-anchor:none;
    -webkit-app-region:no-drag;   /* 同上：拖动交给页面，条目自己也是 no-drag */
  }
  .list::-webkit-scrollbar{ width:0; }
  /* 真正的行容器：窗口高度按它来算，所以不能再靠父级撑开 */
  .rows{ display:block; padding-bottom:4px; }

  /* 每行：红色删除底（默认隐藏）+ 可滑动的条目 */
  .row{
    position:relative;
    border-radius:9px;
    overflow:hidden;
    margin-bottom:3px;
    -webkit-app-region:no-drag;
  }
  /* 红色底只在拖动时显形，平时完全透明 —— 否则每条都像已经被删了 */
  .row::before{
    content:""; position:absolute; inset:0; z-index:0;
    background:linear-gradient(90deg, rgba(255,80,86,.96), rgba(255,80,86,.55));
    opacity:0; transition:opacity .12s ease;
  }
  .row.drag-bg::before{ opacity:1; }
  .row .hint{
    position:absolute; top:0; bottom:0; left:0; z-index:1;
    display:flex; align-items:center; gap:5px;
    padding-left:11px;
    font-size:11.5px; font-weight:600; color:#fff;
    letter-spacing:.4px; pointer-events:none;
    opacity:0; transition:opacity .12s ease;
  }
  .row .hint svg{ width:13px; height:13px; }
  .row.armed .hint{ opacity:1; }

  /* v1.7.0：条目自带一层"深色玻璃"。
     卡片本身没有背景、窗口是透明的，白字如果没有衬底，铺在白色窗口（行情软件、
     文档）前面就整块消失 —— 用户就是这么以为"没加上"的。深底 + 白字在深浅壁纸下都读得出来。 */
  .item{
    position:relative; z-index:2;
    height:30px;
    display:flex; align-items:center; gap:8px;
    padding:0 6px 0 7px;
    border-radius:9px;
    background:rgba(16,22,36,var(--a));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);
    will-change:transform;
    transition:transform .18s cubic-bezier(.2,.8,.3,1), background .15s ease, opacity .18s ease, box-shadow .15s ease;
    /* 条文只用来点、双击、右滑，不做拖动把手 —— 光标保持箭头，
       要挪窗口请按顶栏（标题栏）。 */
    cursor:default;
  }
  .item:hover{ background:rgba(16,22,36,calc(var(--a) + .12)); }
  .item.dragging{ transition:none; }
  .item.removing{
    transform:translateX(110%);
    opacity:0;
    transition:transform .2s ease-in, opacity .2s ease-in;
  }

  /* 完成勾选圈 */
  .chk{
    flex:0 0 auto; width:16px; height:16px; padding:0;
    border:1.6px solid rgba(255,255,255,.45);
    border-radius:50%; background:transparent; cursor:pointer;
    display:grid; place-items:center;
    transition:background .16s ease, border-color .16s ease, transform .12s ease, opacity .16s ease;
  }
  .chk:hover{ border-color:rgba(255,255,255,.8); background:rgba(255,255,255,.10); }
  .chk:active{ transform:scale(.88); }
  .chk svg{
    width:9px; height:9px; opacity:0;
    transform:scale(.5); transition:opacity .14s ease, transform .14s ease;
  }
  .item.done .chk{ background:var(--green); border-color:var(--green); }

  /* 文字 */
  .txt{
    flex:1 1 auto; min-width:0;
    font-size:12.5px; line-height:1.2;
    letter-spacing:.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:color .16s ease, opacity .16s ease;
  }

  /* 双击后换成的编辑框：和 .txt 同字号，看起来"就地变成可改的字" */
  .etxt{
    flex:1 1 auto; min-width:0;
    height:22px; margin:-3px 0; padding:0 6px;
    border:0; border-radius:6px;
    background:rgba(12,17,30,.55);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.42);
    color:#fff; font:inherit; font-size:12.5px; letter-spacing:.2px;
    outline:none; -webkit-app-region:no-drag;
  }
  .etxt::selection{ background:rgba(90,150,255,.55); }

  /* 已勾掉：整条退到背景里 —— 划掉 + 颜色变浅 + 底色更淡 */
  .item.done{
    background:rgba(16,22,36,calc(var(--a) * .6));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .item.done:hover{ background:rgba(16,22,36,calc(var(--a) * .82)); }
  .item.done .chk{ opacity:.75; }
  .item.done .chk svg{ opacity:1; transform:scale(1); }
  .item.done .txt{
    color:rgba(255,255,255,.32);
    text-decoration:line-through;
    text-decoration-thickness:1.5px;
    text-decoration-color:rgba(255,255,255,.30);
  }

  /* 上下拖动排序：被拖的那条抬起来，其它行带过渡让位 */
  .row{ transition:transform .15s cubic-bezier(.2,.8,.3,1); }
  .row.moving{ z-index:6; transition:none; }
  .row.moving .item{
    box-shadow:0 8px 20px rgba(0,0,0,.38), inset 0 0 0 1px rgba(255,255,255,.24);
    cursor:grabbing;
  }

  /* 悬停才出现的删除按钮（替代原来那个小箭头，顺手告诉用户"这里能删"） */
  .del{
    flex:0 0 auto; width:20px; height:20px; margin-right:-2px; padding:0;
    border:0; border-radius:6px; cursor:pointer;
    background:transparent; color:rgba(255,255,255,.5);
    display:grid; place-items:center;
    opacity:0; transition:opacity .14s ease, background .14s ease, color .14s ease;
  }
  .item:hover .del{ opacity:1; }
  .del:hover{ background:rgba(255,80,86,.9); color:#fff; }
  .del:active{ transform:scale(.9); }
  .del svg{ width:12px; height:12px; }

  /* 空状态（只剩历史视图会用） */
  .empty{
    height:33px;
    display:flex; flex-direction:row; align-items:center; justify-content:center;
    gap:7px; color:rgba(255,255,255,.36);
    font-size:11px; letter-spacing:.3px;
  }
  .empty svg{ width:14px; height:14px; opacity:.6; }

  /* ---------- 一条都没有的时候：整张卡就是「待办 + 输入框 + ＋」一行 ----------
     不再留一片空白喊"还没有待办"，而是把输入框本身摆成一条待办的样子 ——
     平时它就是那一条，鼠标点上去直接打字。
     行高 30 与 .item 完全一致，上下 padding 16/16 => 卡片正好 62px，
     和「1 条待办」的收起态一模一样高，所以敲回车加第一条时窗口纹丝不动。 */
  .card.solo{
    flex-direction:row; align-items:center; gap:8px;
    padding:16px 15px;
  }
  /* 顶栏/输入条自己的盒子不要了，让里面的元素直接成为卡片的横排项 */
  .card.solo .hd,
  .card.solo .add{ display:contents; }
  .card.solo .list,
  .card.solo .ft{ display:none; }

  .card.solo .ttl{
    order:1; flex:0 0 auto;
    position:relative; z-index:3;
    font-size:14px; font-weight:600; letter-spacing:.2px;
    /* 标题没有自己的框，只能靠投影从浅色背景里"立"出来（白底窗口前尤其需要） */
    text-shadow:0 1px 2px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.45);
  }
  .card.solo .ttl .cnt{ display:none; }      /* 0 条，统计没意义 */
  .card.solo .add input{
    order:2; flex:1 1 auto; min-width:0;
    height:30px; border-radius:9px; padding:0 10px; font-size:12.5px;
    background:rgba(16,22,36,var(--a));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
    position:relative; z-index:3;
    -webkit-app-region:no-drag;              /* .add 没盒子了，得自己声明 */
  }
  .card.solo .add input:hover{ background:rgba(16,22,36,calc(var(--a) + .12)); }
  .card.solo .add input:focus{
    background:rgba(16,22,36,calc(var(--a) + .22));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.34);
  }
  /* ＋ 钉死在卡片最右：order 必须排在图标后面。
     图标让出的 72px 由输入框吸收（输入框在它左边、可以变窄），
     ＋ 的左右边界因此全程一个像素都不动 —— 用户点它的时候绝不会扑空。 */
  .card.solo .btn-add{
    order:4; flex:0 0 auto; width:30px; height:30px; border-radius:9px;
    background:rgba(16,22,36,var(--a));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
    position:relative; z-index:3;
    -webkit-app-region:no-drag;
  }
  .card.solo .btn-add:hover{ background:rgba(16,22,36,calc(var(--a) + .12)); }
  /* 三个图标平时不占位置，鼠标进来才让出空间。
     位置刻意放在「输入框」和「＋」之间：这样让出的宽度全由输入框吸收，
     ＋ 贴在卡片右侧不动 —— 否则它会跟着图标一起左移 80px，用户点不着。
     宽度有确定值才能过渡 —— 输入框跟着平滑变窄，不会硬跳。
     flex 的 gap 与尺寸无关，宽 0 也照样留 8px 缝，所以用负 margin 抵掉。 */
  .card.solo .acts{
    order:3; flex:0 0 auto;
    position:relative; z-index:3;
    gap:0;                       /* 图标紧挨着排，别在这么窄的地方再留缝 */
    width:0; margin-left:-8px;
    overflow:hidden; opacity:0;
    transition:width .18s ease, margin-left .18s ease, opacity .16s ease;
  }
  .card.solo:hover .acts{ width:72px; margin-left:0; opacity:1; }

  /* ---------- 历史视图 ---------- */
  .hlbl{
    font-size:10px; font-weight:600; letter-spacing:.5px;
    color:rgba(255,255,255,.38);
    padding:6px 7px 4px;
    -webkit-app-region:no-drag;
  }
  .hlbl:first-child{ padding-top:1px; }
  .hrow{
    display:flex; align-items:center; gap:7px;
    height:27px; padding:0 6px; margin-bottom:1px;
    border-radius:8px;
    -webkit-app-region:no-drag;
    transition:background .14s ease;
  }
  .hrow:hover{ background:rgba(255,255,255,.09); }
  .hrow .hi{
    flex:0 0 auto; width:13px; display:grid; place-items:center;
    color:rgba(255,255,255,.4);
  }
  .hrow .hi svg{ width:11px; height:11px; }
  .hrow.ok .hi{ color:var(--green); }
  .hrow.gone .hi{ color:rgba(255,107,112,.85); }
  .hrow .htxt{
    flex:1 1 auto; min-width:0;
    font-size:12px; color:rgba(255,255,255,.74);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hrow.gone .htxt{
    color:rgba(255,255,255,.32);
    text-decoration:line-through;
    text-decoration-thickness:1.5px;
    text-decoration-color:rgba(255,255,255,.5);
  }
  .hrow.gone .htm{ color:rgba(255,255,255,.22); }
  .hrow .htm{
    flex:0 0 auto; font-size:9.5px; letter-spacing:.3px;
    color:rgba(255,255,255,.3);
  }
  .hrow .rest{
    flex:0 0 auto; width:19px; height:19px; padding:0;
    border:0; border-radius:5px; cursor:pointer;
    background:transparent; color:rgba(255,255,255,.5);
    display:grid; place-items:center;
    opacity:0; transition:opacity .14s ease, background .14s ease, color .14s ease;
  }
  .hrow:hover .rest{ opacity:1; }
  .rest:hover{ background:rgba(255,255,255,.2); color:#fff; }
  .rest svg{ width:11px; height:11px; }

  /* ---------- 外观设置面板（透明度 / 磨砂） ---------- */
  .lk{ display:flex; flex-direction:column; gap:9px; padding:2px 1px 6px; }
  .lkrow{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-2); }
  .lkrow span{ flex:0 0 44px; }
  .lkrow b{ flex:0 0 34px; text-align:right; font-weight:500; font-size:11.5px; color:var(--ink); }
  .lkrow input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1 1 auto; height:4px; margin:0;
    border-radius:2px; background:rgba(255,255,255,.22); outline:0; cursor:pointer;
  }
  .lkrow input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .lktip{ font-size:10.5px; line-height:1.45; color:var(--ink-3); padding:2px 0 0; }
  .lkrow.lkchk{ cursor:pointer; -webkit-app-region:no-drag; }
  .lkrow.lkchk span{ flex:1 1 auto; font-size:12px; color:var(--ink-2); }
  .lkrow input[type=checkbox]{
    -webkit-appearance:none; appearance:none; width:15px; height:15px; margin:0; flex:0 0 15px;
    border-radius:4px; border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08); cursor:pointer; position:relative;
  }
  .lkrow input[type=checkbox]:checked{ background:var(--green); border-color:var(--green); }
  .lkrow input[type=checkbox]:checked::after{
    content:""; position:absolute; left:4.5px; top:1.5px; width:4px; height:8px;
    border:solid #0d1526; border-width:0 2px 2px 0; transform:rotate(45deg);
  }

  /* ---------- 页脚 ---------- */
  .ft{
    flex:0 0 auto; height:14px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:10px; color:rgba(255,255,255,.50); letter-spacing:.3px;
  }
  .ft .tip{ opacity:0; transition:opacity .2s ease; }
  body:hover .ft .tip{ opacity:1; }
  .ft .link{ color:rgba(255,255,255,.55); cursor:pointer; opacity:1; -webkit-app-region:no-drag; }
  .ft .link:hover{ color:#fff; text-decoration:underline; }

  /* 返回热区：整条页脚可点，并向外扩 6px（页脚本身只有 14px 高，太难点中） */
  body.ftback .card .ft{ cursor:pointer; }
  body.ftback .card .ft::after{
    content:""; position:absolute;
    left:-4px; right:-4px; top:-6px; bottom:-6px;
  }
  body.ftback .card .ft:hover .link{ color:#fff; text-decoration:underline; }

  /* 历史列表末尾的"清空全部历史"：低调、居右、两段确认 */
  .hclear{
    margin-top:6px; padding:5px 7px;
    font-size:10px; text-align:right;
    color:rgba(255,255,255,.38);
    border-radius:6px; cursor:pointer;
    -webkit-app-region:no-drag;
    transition:background .14s ease, color .14s ease;
  }
  .hclear:hover{ background:rgba(255,90,90,.16); color:#FF8A8A; }

  /* ---------- 平时：卡片自己不画背景，桌面直接透出来 ----------
     收起态只留每一条任务框（条目自己的圆角底），卡片层的渐变 / 内高光 / 叠加色全部撤掉。
     鼠标进来展开时才长出整张卡片的底色 —— 那时候需要一块板子托住顶栏、输入条和页脚。 */
  .card:not(.full){
    background-image:none;
    box-shadow:none;
  }
  .card:not(.full) .tint,
  .card:not(.full)::after{ display:none; }

  /* 没有卡片底垫着，条目自己就是唯一的那块"玻璃"：比展开态再实一点 */
  .card:not(.full) .item{
    background:rgba(16,22,36,var(--a));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .card:not(.full) .item:hover{ background:rgba(16,22,36,calc(var(--a) + .12)); }
  .card:not(.full) .item.done{
    background:rgba(16,22,36,calc(var(--a) * .6));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .card:not(.full) .item.done:hover{ background:rgba(16,22,36,calc(var(--a) * .82)); }

  /* ---------- 平时只留待办条目，鼠标进来才把整张卡展开 ----------
     收起时 顶栏 / 输入条 / 页脚 直接 display:none —— 卡片是真的变矮，不是留白。
     展开时页面报新的 h 和 top，主进程把窗口向上长 65px（顶栏22+输入条43），
     条目在屏幕上的位置不动，所以鼠标底下那一行不会跳。
     solo（一条都没有）时这三块另有安排，不能一起隐藏，所以排除掉。 */
  .card:not(.full):not(.solo) .hd,
  .card:not(.full):not(.solo) .add,
  .card:not(.full):not(.solo) .ft{ display:none; }

  /* 展开瞬间淡入，别硬蹦出来 */
  @keyframes reveal{ from{ opacity:0; } to{ opacity:1; } }
  .card.full .hd{ animation:reveal .16s ease both; }
  .card.full .add{ animation:reveal .14s ease both; }
  .card.full .ft{ animation:reveal .18s ease both; }

  /* ---------- 拖动中：把"皮肤"抽掉，只剩任务框 ----------
     挪窗口的时候最想知道的是"这几个框摆在哪、跟别的窗口齐不齐"，展开态那块
     卡片底会把周围盖住，反而看不准。所以拖动期间整张卡退回收起态的样子。

     只撤皮肤、不动布局：顶栏/输入条/页脚用 opacity 淡出，不用 display:none ——
     一 display:none 条目就整体上移，鼠标底下那行会跳，对齐也就没法看了。
     窗口高度也不改：拖动中改高度会让系统重算拖动锚点，窗口会突然跳一下。 */
  /* 手按住窗口的这一刻：别选字、别给任何"抓手/文本"光标。
     拖动是页面自己算的，窗口跟着鼠标跑的时候一旦选中文字，
     画面会拖出一片蓝色选区，看着就像花屏。 */
  body.drag-lock, body.drag-lock *{
    user-select:none !important;
    cursor:default !important;
  }

  /* 拖动中只留"待办事项那一条/几条"：卡片底、顶栏、输入条、页脚全部退场。
     这是原来就有的效果，用户明确要保留 —— 挪位置时看的是"我要跟哪个图标对齐"，
     条目本身才是参照物，整块卡底反而把周围盖住、看不清落点。
     只撤皮肤、不动布局：opacity 淡出而不是 display:none ——
     一 display:none 条目就整体上移，鼠标底下那行会跳，对齐就没法看了。
     窗口高度也不改：拖动中改高度会让系统重算锚点，窗口会突然跳一下。 */
  body.dragging .card{
    background-image:none !important;
    background-color:transparent !important;
    box-shadow:none !important;
  }
  body.dragging .card .tint,
  body.dragging .card::after{ display:none; }

  .card .hd, .card .add, .card .ft{ transition:opacity .13s ease; }
  body.dragging .card .hd,
  body.dragging .card .add,
  body.dragging .card .ft{
    opacity:0 !important;
    animation:none !important;   /* .full 的 reveal 动画带 both，会压住 opacity */
    pointer-events:none;
  }
  /* 没有卡片底垫着，条目自己就是唯一那块玻璃 */
  body.dragging .card .item{
    background:rgba(16,22,36,var(--a));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
  }
  body.dragging .card .item.done{
    background:rgba(16,22,36,calc(var(--a) * .6));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }
  /* 拖动时不要"悬停变色"，不然鼠标划过哪条哪条亮，像在选中 */
  body.dragging .card .item:hover{ background:rgba(16,22,36,var(--a)); }
  body.dragging .card .item.done:hover{ background:rgba(16,22,36,calc(var(--a) * .6)); }
</style>
</head>
<body>

<div id="bd"></div>

<div class="card" id="card">
  <div class="tint"></div>

  <div class="hd" id="hd">
    <div class="ttl">待办<span class="cnt" id="cnt"></span></div>
    <div class="acts">
      <button class="act" id="histBtn" title="历史记录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7.5v5l3.2 2"/><circle cx="12" cy="12" r="8.2"/>
        </svg>
      </button>
      <button class="act" id="menuBtn" title="更多（置顶 / 清除已完成 / 退出）">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <circle cx="12" cy="5.2" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="18.8" r="1.9"/>
        </svg>
      </button>
      <button class="act" id="closeBtn" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="add" id="addBar">
    <input id="inp" type="text" placeholder="写点什么，移开就记下" autocomplete="off" spellcheck="false" maxlength="80">
    <button class="btn-add" id="addBtn" title="添加" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M12 5.5v13M5.5 12h13"/>
      </svg>
    </button>
  </div>

  <div class="list" id="list"><div class="rows" id="rows"></div></div>

  <div class="ft" id="ft">
    <span id="ftL">回车添加</span>
    <span class="tip" id="ftR">按住往右滑删除</span>
  </div>
</div>

<script>
/* ================= preload 缺失时的兜底 =================
   window.wgt 由 preload 注入。万一它没加载（asar/路径出问题，或者直接在浏览器里
   打开这个文件调试），下面任何一句 window.wgt.xxx 都会抛错 —— 整个脚本直接死掉，
   卡片退化成静态 HTML：数据不渲染、所有手势失效，而且看不出是哪坏了。
   这里补一层空实现，最差也只是"变成一张普通网页卡片"。 */
if (!window.wgt) {
  const noop = () => {};
  const on = () => noop;
  window.wgt = {
    acrylic: false,
    close: noop, menu: noop, dragBegin: noop, dragMove: noop, dragEnd: noop,
    setRegion: noop, imeBegin: noop, imeEnd: noop,
    setCardHeight: () => Promise.resolve(true),
    backdropNow: () => Promise.resolve(null),
    getLook: () => Promise.resolve(null),
    setLook: () => Promise.resolve(true),
    onCursor: on, onDragLook: on, onFocusInput: on, onClearDone: on,
    onShowHistory: on, onShowLook: on, onSetFullmode: on, onBackdrop: on,
    onBdFull: on, onBdPos: on, onBdDragEnd: on,
    onImeText: on, onImeCommit: on, onImeCancel: on, onImeBlur: on,
  };
}

/* ================= 数据 ================= */
const STORE = "todo_v1";          /* 待办本身，沿用旧键，不破坏已有数据 */
const HSTORE = "todo_hist_v1";    /* 历史记录，独立键 */
const HIST_MAX = 120;             /* 最多留 120 条，再老的自然淘汰 */

const state = { items: [], hist: [], view: "todo" };

function load() {
  try {
    const arr = JSON.parse(localStorage.getItem(STORE) || "[]");
    state.items = Array.isArray(arr) ? arr.filter((t) => t && typeof t.text === "string") : [];
  } catch (e) { state.items = []; }

  try {
    const h = JSON.parse(localStorage.getItem(HSTORE) || "[]");
    state.hist = Array.isArray(h) ? h.filter((t) => t && typeof t.text === "string") : [];
  } catch (e) { state.hist = []; }
}

const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state.items)); } catch (e) {} };
const saveHist = () => { try { localStorage.setItem(HSTORE, JSON.stringify(state.hist)); } catch (e) {} };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));
const uid = () => Date.now() + "-" + Math.random().toString(36).slice(2, 7);

/* ================= 图标 ================= */
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 12.2a1.6 1.6 0 001.6 1.5h6a1.6 1.6 0 001.6-1.5L17.5 7"/></svg>';
const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h10.5a5 5 0 010 10H8"/><path d="M7.5 5.5L4 9.5l3.5 4"/></svg>';
const ICON_EMPTY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4.5" width="16" height="15" rx="3"/><path d="M8.5 10h7M8.5 14h4.5"/></svg>';
const ICON_EMPTY_H = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.5v5l3.2 2"/></svg>';

/* ================= 历史：按天分组 ================= */
const pad2 = (n) => String(n).padStart(2, "0");
const dayOf = (ts) => {
  const d = new Date(ts);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
};
function dayLabel(ts) {
  const diff = Math.round((dayOf(Date.now()) - dayOf(ts)) / 86400000);
  if (diff <= 0) return "今天";
  if (diff === 1) return "昨天";
  const d = new Date(ts);
  return (d.getMonth() + 1) + "月" + d.getDate() + "日";
}
const hhmm = (ts) => { const d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };

function pushHist(text, kind) {
  state.hist.unshift({ id: uid(), text: String(text), kind: kind, at: Date.now() });
  if (state.hist.length > HIST_MAX) state.hist.length = HIST_MAX;
  saveHist();
}

/* ================= 渲染 ================= */
/* 正在双击编辑的条目 id（null = 没在编辑）。渲染时它那一行换成 input，
   保证光标、选区、撤销都由浏览器自己管，不用手搓。 */
let editId = null;
let clearArm = 0;      /* "清空全部历史"的两段确认时间戳（0 = 未armed） */

/* ---------- 首用引导 ----------
   第一次用的人不知道卡片有哪些手势（悬停展开 / 右滑删除 / 双击改字），
   在页脚放一行小字，看 6 秒或者一动手就撤，之后不再出现。 */
const HINT_KEY = "todo_hint_v1";
let hintSeen = false, hintTimer = null;
try { hintSeen = localStorage.getItem(HINT_KEY) === "1"; } catch (e) {}

function markHintSeen() {
  if (hintSeen) return;
  hintSeen = true;
  try { localStorage.setItem(HINT_KEY, "1"); } catch (e) {}
  clearTimeout(hintTimer);
  hintTimer = null;
  renderMeta();
}
function armHint() {
  if (hintSeen || hintTimer) return;
  hintTimer = setTimeout(markHintSeen, 6000);
}

function renderList() {
  const rows = $("rows");
  const items = state.items;

  if (state.view === "look") {
    rows.innerHTML =
      '<div class="lk">' +
        '<label class="lkrow"><span>透明度</span>' +
          '<input id="lkAlpha" type="range" min="8" max="94" step="1">' +
          '<b id="lkAlphaV"></b></label>' +
        '<label class="lkrow frost"><span>磨砂</span>' +
          '<input id="lkFrost" type="range" min="0" max="20" step="1">' +
          '<b id="lkFrostV"></b></label>' +
        '<label class="lkrow lkchk"><input id="lkFull" type="checkbox">' +
          '<span>完全体（整张卡常驻）</span></label>' +
        '<div class="lktip">背景是桌面快照：图标挪过 / 换过壁纸后，右键→刷新桌面背景</div>' +
      '</div>';
    bindLook();
    return;
  }

  if (state.view === "hist") {
    if (!state.hist.length) {
      rows.innerHTML = '<div class="empty">' + ICON_EMPTY_H + '<div>还没有记录</div></div>';
      return;
    }
    let html = "", last = "";
    state.hist.forEach((h) => {
      const lbl = dayLabel(h.at);
      if (lbl !== last) { html += '<div class="hlbl">' + lbl + '</div>'; last = lbl; }
      const gone = h.kind === "del";
      html += '<div class="hrow ' + (gone ? "gone" : "ok") + '" data-hid="' + h.id + '">' +
        '<span class="hi">' + (gone ? ICON_TRASH : ICON_CHECK) + '</span>' +
        '<span class="htxt" title="' + esc(h.text) + '">' + esc(h.text) + '</span>' +
        '<span class="htm">' + hhmm(h.at) + '</span>' +
        '<button class="rest" data-act="restore" title="放回待办">' + ICON_BACK + '</button>' +
      '</div>';
    });
    /* 清空历史放在列表最末尾：要滚到底才看得到，降低误触 */
    html += '<div class="hclear" data-act="clear-hist">' +
      (clearArm ? "再点一次确认清空" : "清空全部历史") + '</div>';
    rows.innerHTML = html;
    return;
  }

  if (!items.length) {
    /* 一条都没有：列表留空，由 .card.solo 那一行（输入框本身）承担整张卡 */
    rows.innerHTML = "";
    return;
  }

  let html = "";
  items.forEach((t) => {
    /* 双击进来的那一条换成输入框；其余照常。input 走浏览器原生输入法/撤销/选区 */
    const body = editId === t.id
      ? '<input class="etxt" data-id="' + t.id + '" value="' + esc(t.text) + '" spellcheck="false" maxlength="80">'
      : '<span class="txt" title="' + esc(t.text) + '">' + esc(t.text) + '</span>';
    html += '<div class="row" data-id="' + t.id + '">' +
      '<div class="hint">' + ICON_TRASH + '<span>松手删除</span></div>' +
      '<div class="item' + (t.done ? " done" : "") + (editId === t.id ? " editing" : "") + '" data-id="' + t.id + '">' +
        '<button class="chk" data-act="toggle" title="' + (t.done ? "标记为未完成" : "标记为已完成") + '">' + ICON_CHECK + '</button>' +
        body +
        '<button class="del" data-act="del" title="删除">' + ICON_TRASH + '</button>' +
      '</div></div>';
  });
  rows.innerHTML = html;
}

function renderMeta() {
  const items = state.items;
  const done = items.filter((t) => t.done).length;
  const hist = state.view === "hist";
  const look = state.view === "look";

  $("histBtn").classList.toggle("on", hist);
  /* 标题旁的数字 = **还没办完的条数**（以前是"已完成/总数"，一眼看不出还剩几件） */
  const undone = items.length - done;
  $("cnt").textContent = hist
    ? (state.hist.length ? state.hist.length + " 条记录" : "")
    : (look ? "外观"
      : (items.length ? (undone > 0 ? String(undone) : "全部完成") : ""));

  /* 页脚左槽：待办视图下先给第一次用的人看一遍手势提示（6 秒或一动手就撤），
     之后换回统计。原来这里写"回车添加"，但实际是"失焦/移开鼠标就提交"，
     文案和行为对不上（用户会以为必须按回车）。 */
  const hinting = !hintSeen && !hist && !look && items.length > 0;
  $("ftL").textContent = hist
    ? (state.hist.length ? "共 " + state.hist.length + " 条记录" : "历史记录")
    : (look ? "拖动滑杆即时生效"
      : (hinting ? "悬停展开 · 右滑删除 · 双击改字"
        : (items.length ? "共 " + items.length + " 项 · 已完成 " + done : "移开鼠标就自动记下")));
  if (hinting) armHint();

  /* 页脚右侧：非待办视图统一是"返回"。清空历史挪到列表末尾（见 renderList），
     免得"学过一次点这里收起"的人在这里一键清空历史。 */
  document.body.classList.toggle("ftback", hist || look);
  const r = $("ftR");
  if (hist || look) {
    r.textContent = "← 返回待办";
    r.className = "link";
  } else if (hinting) {
    r.textContent = "";          /* 左边已经在教手势了，右边别重复 */
    r.className = "tip";
  } else {
    r.textContent = "按住往右滑删除";
    r.className = "tip";
  }
}

function render() {
  renderList();
  renderMeta();
  applySolo();   /* 条目清空/新增会在这两种版式之间切 */
  applyFull();   /* 条目增减会改变"该不该展开"，例如删光了要露出输入框 */
  syncAddBtn();
  syncHeight();
  requestRegion();   /* 行数变了，窗口形状也要跟着变（多一条就多一块） */
  focusEdit();
}

/* 渲染完把光标放回编辑框末尾（不全选 —— 多数时候是来改错字的） */
function focusEdit() {
  if (!editId) return;
  const el = $("rows").querySelector(".etxt");
  if (!el) return;
  el.focus();
  try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
}

/* ================= 窗口高度跟着内容走 =================
   主进程收到的高度是"卡片本身"的高度，外层给投影留的透明边距由主进程自己加。
   收起/展开会真的改变布局，所以这里按"当前可见的元素"算，不能写死。 */
const pxv = (el, p) => parseFloat(getComputedStyle(el)[p]) || 0;
const shown = (el) => !!el && getComputedStyle(el).display !== "none";

/* 一条都没有（且不在看历史）→ 整张卡就是「待办 + 输入框 + ＋」横排一行。
   完全体例外：空列表也走正常版式，整个方框（标题栏+输入行+页脚）照样出现。 */
function isSolo() {
  return !LOOK.full && state.view === "todo" && state.items.length === 0;
}

/* 待办区上沿距卡片内容顶边的距离：收起时只剩 padding + 列表间距 */
function topOffset() {
  /* solo 时没有列表，那一行直接贴着卡片上沿 */
  if (isSolo()) return Math.round(pxv($("card"), "paddingTop"));
  let t = pxv($("card"), "paddingTop") + pxv($("list"), "marginTop");
  ["hd", "addBar"].forEach((id) => {
    const el = $(id);
    if (!shown(el)) return;
    t += el.offsetHeight + pxv(el, "marginTop") + pxv(el, "marginBottom");
  });
  return Math.round(t);
}

/* 收起状态的 top：拖动窗口时主进程按这个把 y 换算回"安静时的位置"。
   solo 的上下 padding 刻意是 16/16、非 solo 是 11+5 —— 两者都等于 16，
   所以两种版式互切时锚点一致，窗口不会平移。 */
function idleTop() {
  return Math.round(pxv($("card"), "paddingTop") + (isSolo() ? 0 : pxv($("list"), "marginTop")));
}

function contentHeight() {
  const card = $("card"), list = $("list");
  if (isSolo()) {
    /* 横排一行：最高那个元素 + 上下 padding */
    const row = Math.max(
      $("inp").offsetHeight,
      $("addBtn").offsetHeight,
      card.querySelector(".ttl").offsetHeight
    );
    return pxv(card, "paddingTop") + pxv(card, "paddingBottom") + row;
  }
  let h = pxv(card, "paddingTop") + pxv(card, "paddingBottom")
        + pxv(list, "marginTop") + pxv(list, "marginBottom")
        + $("rows").offsetHeight;
  ["hd", "addBar", "ft"].forEach((id) => {
    const el = $(id);
    if (!shown(el)) return;
    h += el.offsetHeight + pxv(el, "marginTop") + pxv(el, "marginBottom");
  });
  return h;
}

let hTimer = null, lastH = -1, lastTop = -1;

/* 拖动期间锁高度：窗口在被鼠标搬，这时候再让布局去改 y，
   两边抢同一个窗口位置，手感和画面都会抖。松手后补一次。 */
let heightLocked = false;

function syncHeight(now) {
  clearTimeout(hTimer);
  if (heightLocked) return;
  const send = () => {
    const h = Math.round(contentHeight());
    const top = topOffset();
    if (h === lastH && top === lastTop) return;
    lastH = h; lastTop = top;
    if (window.wgt && window.wgt.dbg) {
      window.wgt.dbg(`SEND h=${h} top=${top} topMin=${idleTop()} full=${document.getElementById("card").classList.contains("full")} drag=${document.body.classList.contains("dragging")}`);
    }
    if (window.wgt && window.wgt.setCardHeight) {
      window.wgt.setCardHeight({
        h: h,
        top: top,
        topMin: idleTop(),
      });
    }
    requestRegion();     /* 窗口尺寸变了，形状跟着重算（收起/展开的高度不一样） */
  };
  /* 收起/展开必须立刻报：晚一帧窗口和布局就对不上，鼠标底下会闪 */
  if (now) send();
  else hTimer = setTimeout(send, 30);   /* 用定时器不用 rAF：窗口被遮住时 rAF 会暂停 */
}

/* ================= 窗口形状：跟视觉严丝合缝 =================
   桌面层里卡片是 Progman 的子窗口，而 Windows 只把它和父窗口（壁纸）合成 ——
   透明像素能透出壁纸，透不出同级的图标层。窗口矩形里多出来的透明部分，
   在桌面上就是"把图标抹掉"（用户截图：拖到图标区，整片图标消失）。
   所以窗口形状必须只在"真的画了东西"的地方存在：
     · 展开态（有卡片底）→ 整窗，本来就该盖住桌面；
     · 收起态 / 拖动中（视觉上只剩条目）→ 每条待办一块矩形；
     · 一条都没有（solo）→ 输入框那一行。
   区域之外既不画也不收鼠标，图标原样露出来、点得到。 */
let rgnTimer = null, rgnLast = "";

function regionRects() {
  const dragging = document.body.classList.contains("dragging");
  const full = cardEl.classList.contains("full") && !dragging;
  if (full) return [{ x: 0, y: 0, w: window.innerWidth, h: window.innerHeight }];

  const rows = Array.prototype.slice.call(document.querySelectorAll("#rows .row"));
  const out = [];
  rows.forEach((r) => {
    const b = r.getBoundingClientRect();
    if (b.width > 2 && b.height > 2) out.push({ x: b.left, y: b.top, w: b.width, h: b.height });
  });
  if (out.length) return out;

  /* solo：整张卡就是"输入框那一条"，按它的高度取一条 */
  const inp = $("inp");
  if (inp) {
    const b = inp.getBoundingClientRect();
    const c = cardEl.getBoundingClientRect();
    if (b.height > 2) return [{ x: c.left, y: b.top - 4, w: c.width, h: b.height + 8 }];
  }
  return [];
}

function reportRegion() {
  if (!window.wgt || !window.wgt.setRegion) return;
  const list = regionRects().map((o) => ({
    x: Math.round(o.x), y: Math.round(o.y), w: Math.round(o.w), h: Math.round(o.h),
  }));
  const sig = JSON.stringify(list);
  if (sig === rgnLast) return;
  rgnLast = sig;
  window.wgt.setRegion(list);
}

/* 布局往往要等一帧才稳定（展开动画、行数变化），合并成一次再报 */
function requestRegion() {
  clearTimeout(rgnTimer);
  rgnTimer = setTimeout(reportRegion, 30);
}

/* ================= 收起 / 展开 =================
   平时只留条目；这几种情况必须展开：鼠标在卡上、正在打字、在看历史。
   一条都没有时改走 solo 版式：输入框已经在眼前，展开反而会让鼠标底下那一行跳走。 */
let hovering = false, typing = false;

function wantFull() {
  /* 完全体：不管鼠标在不在，整张卡都展开 */
  if (LOOK.full) return true;
  if (isSolo()) return false;
  /* 双击编辑时也必须展开：鼠标一挪开就把编辑框收掉，会让人以为改丢了 */
  return state.view === "hist" || state.view === "look" || hovering || typing || !!editId;
}

function applyFull() {
  /* 拖动中必须当成"非展开"：完全体下 .full 一直挂着，卡片的渐变底（.tint）
     不会被平时那条 :not(.full) 规则撤掉，窗口又被裁成只剩条目矩形 ——
     渐变叠在条目玻璃底上就是用户看到的"黑条"。 */
  const on = wantFull() && !document.body.classList.contains("dragging");
  const card = $("card");
  if (card.classList.contains("full") === on) return false;
  card.classList.toggle("full", on);
  return true;
}

function applySolo() {
  const on = isSolo();
  const card = $("card");
  if (card.classList.contains("solo") === on) return false;
  card.classList.toggle("solo", on);
  return true;
}

const cardEl = $("card");

/* ================= 什么才算"真的离开了" =================
   收起这张卡只有一个理由：光标真的不在窗口里了。

   页面自己的 mouseleave 不够格当这个理由 —— 展开时窗口自己往上长 63px、
   高度 +77px，Chromium 会按旧坐标重新命中一次，偶尔甩一个假的 mouseleave，
   看起来就是"鼠标明明还在框里，它自己隐藏了"。

   所以主进程每 90ms 用系统光标跟窗口矩形比一次，只在变化时推 wgt:cursor。
   sysInside 只有拿到真实值才生效；拿不到（老版本 preload / 页面测试桩）时保持
   老的 :hover 判定，不能因为"不知道"就把卡片永远钉住。
   注意这套判断是纯几何的（光标坐标 vs 窗口矩形，不看遮挡）：卡片被别的窗口
   压住时鼠标扫过也会判"进入"，所以这里只用来展开/收起，绝不拿来做
   "抬升到最前" —— 那个行为已在 v1.0.3 按用户要求移除。 */
let sysInside = null;        /* null = 还不知道，按老规矩来 */
let leaveTimer = null, collapseTimer = null;

/* ================= "只想点完成"：左侧勾选带不触发整卡展开 =================
   光标压在每条待办最左边那一竖条（勾选圈那一片）时，卡片保持收起的样子 ——
   很多人只是想点一下"已完成"，不想让整张卡弹出来。
   两条边界规则：
     · 只有"收起态"才拦。已经展开时从文字挪到圈上不收起 —— 否则按钮会从手底下跑掉；
     · 压着勾选带进来后，光标往右挪出这一条立刻展开，不用先离开卡片。
   判定用矩形（不是 :hover）：勾选圈只有 22px，按行高整条算更好点中。 */
/* "不展开"那条竖带占卡片宽度的比例。0.5 = 左半边都不展开（用户选的），
   想调就改这一个数：1/3 更灵敏、1/2 更宽容。 */
const QUICK_ZONE_RATIO = 0.5;

function overQuickZone(cx, cy) {
  if (state.view !== "todo") return false;
  /* ① 浏览器自己的 hover 命中：最准，不受"坐标换算/窗口刚被挪过"影响
        （主进程推来的 cx/cy 是按它那一刻的窗口矩形算的，窗口刚变过就会偏） */
  if (cardEl.querySelector("#rows .chk:hover")) return true;
  /* ② 主判据：卡片**左侧 QUICK_ZONE_RATIO 宽**这一整条竖带都不展开。
        为什么按 1/3 而不是"勾选圈 + 14px"：鼠标习惯是从左边/左下往右滑进来，
        先经过的是窗口左侧留白和圈左边那一段；按圈算太窄，手一进整张卡就弹开
        （用户实测）。1/3 覆盖"圈 + 前几个字"，想展开往右挪过这条线即可。
        上下不限：行缝也算，整条带连续不闪。 */
  if (cx == null) return false;
  const w = cardEl.clientWidth || 320;
  return cx <= Math.round(w * QUICK_ZONE_RATIO);
}

let hoverQuick = false;
/* 按住某条待办期间（勾选 / 右滑删除）保持收起：这时候只想看到那几条，
   不想整张卡弹开 —— 包括鼠标往右滑越过左侧 1/3 线的时候。 */
let holdCollapsed = false;

function enterFrame(cx, cy) {
  clearTimeout(leaveTimer);
  clearTimeout(collapseTimer);
  /* 幽灵输入窗隐藏的那一下，系统会把鼠标位置补发给卡片，产生一次坐标落在输入框上的
     假 mouseenter —— 刚收起又展开就是这么来的。系统光标还说"在外面"时，这段时间内的
     enter 一律不认（真悬停会由主进程的轮询再推一次，最多晚 90ms）。 */
  if (Date.now() - imeEndAt < 350 && sysInside === false) return;
  /* 收起态 + 光标压在勾选带上 → 不展开，保持简洁 */
  if (!cardEl.classList.contains("full") && (holdCollapsed || overQuickZone(cx, cy))) {
    hoverQuick = true;
    hovering = false;
    return;
  }
  hoverQuick = false;
  hovering = true;
  /* 不做"悬停抬升"了：watchCursor 是纯几何判断，卡片被别的窗口压住时
     鼠标扫过那块区域也会被判成"进入"，卡片会自己跳到最前面打断人 —— 用户实测很烦。
     现在卡片安分待在自己的层里；被压住想唤回来，走右键菜单"显示待办卡片"
     （second-instance 会把窗口提到最前）。 */
  if (applyFull()) syncHeight(true);
}

/* 压着勾选带进来的：光标一挪出那一条就展开（不用先离开卡片再进来） */
cardEl.addEventListener("mousemove", (e) => {
  if (!hoverQuick) return;
  if (holdCollapsed || drag) return;      /* 按住条目/正在右滑：别再判"该展开了" */
  if (overQuickZone(e.clientX, e.clientY)) return;
  hoverQuick = false;
  enterFrame(e.clientX, e.clientY);
});

/* 鼠标离开整张卡 = 这次输入结束了。给 320ms 反悔时间（只是划过去不算），
   真的走了就把输入框里的话收进待办并松开焦点。 */
function leaveFrame() {
  clearTimeout(leaveTimer);
  hoverQuick = false;
  if (inp.value.trim() && document.activeElement === inp) {
    leaveTimer = setTimeout(() => {
      if (sysInside === true) return;
      if (cardEl.matches(":hover")) return;
      if (commitInput()) inp.blur();
    }, 320);
  }

  clearTimeout(collapseTimer);
  collapseTimer = setTimeout(() => {
    if (sysInside === true) return;      /* 光标还在窗口里 —— 这声 leave 是假的 */
    /* :hover 只在"拿不到系统光标"时才算数。桌面层里它并不可靠：
       幽灵输入窗盖在输入框上时，页面收不到 mouseleave，:hover 会一直是 true，
       结果编辑完挪走鼠标、卡片再也不收（用户报的"点桌面空白处不退回"）。 */
    if (sysInside === null && cardEl.matches(":hover")) return;
    imeFinish(true);                     /* 收桥：行内编辑 / 底部输入框都在这里落定 */
    /* 兜底：焦点早就没了但 typing 还挂着（桥异常/异步顺序），直接清掉，
       否则这一位会把卡片永远钉在展开态。 */
    if (typing && document.activeElement !== inp) typing = false;
    /* 桥没开着的时候（普通窗口模式）兜底：真离开了就结束编辑。
       否则 editId 会让 wantFull() 永远为真，卡片再也收不回去
       （用户报的"点桌面空白处它不退回"就是这个）。 */
    if (editId) endEdit(true);
    hovering = false;
    /* 点桌面空白 = "我不看了"：历史/外观视图一并复位回待办 */
    if (state.view !== "todo") setView("todo");
    if (applyFull()) syncHeight(true);
  }, 120);
}

cardEl.addEventListener("mouseenter", (e) => enterFrame(e.clientX, e.clientY));
cardEl.addEventListener("mouseleave", leaveFrame);

/* 系统那一路：光标进出窗口矩形时推一次。它不受窗口重排影响，是唯一的真话。 */
if (window.wgt && window.wgt.onCursor) {
  window.wgt.onCursor((p) => {
    const inside = !!(p && p.inside);
    if (inside === sysInside) return;
    sysInside = inside;
    /* 带光标坐标进来：页面据此判断是不是压在左侧勾选带上（压在那一竖条上不展开） */
    if (inside) enterFrame(p && p.cx, p && p.cy); else leaveFrame();
  });
}

/* 只有输入框算"正在打字"。勾选/删除按钮点完也拿焦点，那种不算，
   否则点一下就永久展开、再也收不回去。 */
cardEl.addEventListener("focusin", (e) => {
  if (e.target !== inp) return;
  typing = true;
  if (applyFull()) syncHeight(true);
});
cardEl.addEventListener("focusout", (e) => {
  if (e.target !== inp) return;
  typing = false;
  if (applyFull()) syncHeight(true);
});

/* ================= 拖动中：只剩任务框 =================
   外观只撤皮肤不撤布局，理由写在上面对应的 CSS 注释里。
   lookNative 现在只服务"外面的搬迁"（主进程 will-move 那一路），
   左键/中键自己拖的用 lookDrag。 */
let lookNative = false, lookDrag = false;

function renderLook() {
  /* ★ 完全体（body.fullmode）下拖动**不换外观**：整张卡原样跟着走。
     原来这里无条件挂 body.dragging，会把卡片皮肤抽掉、只剩几条 ——
     完全体本来就是"整张卡常驻"，一拖就抽掉反而突兀（用户要求）。
     普通模式下照旧：拖动时退成"只剩任务框"，方便看对齐。
     注意用 body.fullmode 判，不用 LOOK —— LOOK 在本文件后面才声明。 */
  const wantDrag = (lookNative || lookDrag) && !document.body.classList.contains("fullmode");
  document.body.classList.toggle("dragging", wantDrag);
  applyFull();              /* 拖动开始/结束要摘/戴皮肤（普通模式下才摘） */
  requestRegion();          /* 拖动开始/结束都要重裁窗口：整窗 ⇄ 只剩条目 */
}

/* ================= 右滑删除：强制只显示条目 =================
   按下时卡片可能已经因为悬停展开了（比如鼠标停在右半边），
   这时 holdCollapsed 拦不住（它只管"别展开"，不管"收起来"）。
   右滑真正开始（越过 6px）就把卡片临时切成收起态，松手再恢复。
   收起/恢复都走 syncHeight，主进程按 __rowsY 锚点重算窗口位置 ——
   条目在屏幕上不动，手底下那一行不会跑掉。 */
let swipeCollapsed = false;

function swipeLook(on) {
  if (swipeCollapsed === on) return;
  if (on) markHintSeen();          /* 已经会用右滑了，别再教 */
  if (document.body.classList.contains("fullmode")) return;   /* 完全体不动 */
  swipeCollapsed = on;
  lookDrag = on;
  heightLocked = false;        /* 收起要改高度；恢复也要改 */
  renderLook();
  syncHeight(true);
}

function setNativeLook(on) {
  if (lookNative === !!on) return;
  lookNative = !!on;
  renderLook();
}

/* ================= 拖动窗口：左键 / 中键同一套 =================
   ★ 为什么不用 -webkit-app-region: drag 了
   卡片贴进桌面层后是 Progman 的子窗口（WS_CHILD）。系统那套"非客户区拖动"
   （Chromium 在 drag 区按下 → SendMessage WM_NCLBUTTONDOWN + HTCAPTION）
   在子窗口上不会进入移动循环 —— 实测：按住左键匀速拖 26 帧，窗口 x 一动不动，
   唯一一次位移是悬停展开把它往上顶了 63px，从外面看就是"拖不动、还一闪一闪"。
   而子窗口本身完全能移动（原生 SetWindowPos 实测 6/6 帧跟手），
   所以改成页面自己算屏幕坐标位移、主进程照着挪，和中键走同一条路。
   代价：失去 Aero Snap 贴边分屏（卡片本来也用不上贴半屏）。

   位移一律用屏幕坐标 —— 窗口一动，client 坐标立刻失真，屏幕坐标不会。 */
let winDrag = null, dragTimer = null;

/* 这些地方按下是"操作"，不是"搬窗口" */
const DRAG_SKIP = "input, textarea, button, a, .item, .btn-add, .acts, .etxt";

function pokeDrag() {
  clearTimeout(dragTimer);
  /* 只是保险丝，不是收尾手段：正常收尾靠 mouseup + 主进程的 wgt:drag-look{on:false}。
     时间必须远长于一次拖动 —— 窗口跟着光标走时页面收不到 mousemove，这条定时器
     不会被续命；原来写 700ms，按住不动 0.7 秒就被误判"该收工"，
     手上就是"拖到一半卡片不跟手了"（用户报的漂移）。 */
  dragTimer = setTimeout(() => endDrag(), 15000);
}

function endDrag() {
  clearTimeout(dragTimer);
  if (!winDrag) return;
  winDrag = null;
  lookDrag = false;
  document.body.classList.remove("drag-lock");
  renderLook();
  heightLocked = false;
  if (window.wgt && window.wgt.dbg) window.wgt.dbg("DRAG_END(page)");
  syncHeight(true);
  if (window.wgt && window.wgt.dragEnd) window.wgt.dragEnd();
}

window.addEventListener("mousedown", (e) => {
  if (e.button !== 0 && e.button !== 1) return;
  if (winDrag) return;
  /* 正在输入的那个框里，中键还是留给系统（Windows 上是"粘贴"）。
     但没聚焦时不抢 —— 一条待办都没有时整张卡就剩这个输入框，
     要是也不让按，空列表就没地方下手拖了。 */
  const box = e.target.closest("input, textarea, .etxt");
  if (e.button === 1 && box && document.activeElement === box) return;
  /* 只有左键要避开"操作区"（条目、按钮、输入框）：在那些地方按下左键是点击/排序。
     中键是专门的搬窗口手势，窗口里任意位置都该能拖 —— 原本就是这样，
     上一版把这条判断写成了不分按键，中键就被一起挡掉了（用户反馈"中键拖不动了"）。 */
  if (e.button === 0 && e.target.closest(DRAG_SKIP)) return;

  if (e.button === 1) e.preventDefault();   /* 挡掉 Windows 的自动滚动圆圈 */
  winDrag = { sx: e.screenX, sy: e.screenY, moved: false };
  document.body.classList.add("drag-lock");
  /* 按下就锁高度：这一次手势可能是"拖窗口"，也可能是"点一下"，
     两种都不该让布局去改窗口位置。松手时 endDrag 会解锁并补一次 syncHeight。 */
  heightLocked = true;
  if (window.wgt && window.wgt.dragBegin) window.wgt.dragBegin(e.button);
  pokeDrag();
}, true);

window.addEventListener("mousemove", (e) => {
  if (!winDrag) return;
  /* 松手落在窗口外面时，页面收不到 mouseup，只能靠"按键已经没了"判断 */
  if (e.buttons === 0) { endDrag(); return; }
  pokeDrag();
  if (winDrag.moved) return;      /* 已经在拖了，下面的判断只做一次 */
  const dx = e.screenX - winDrag.sx;
  const dy = e.screenY - winDrag.sy;
  /* 手抖 1~2px 不算拖。过了阈值才撤皮肤：单击不闪、按住不动也不闪。
     位移本身不往主进程发 —— 它每 8ms 自己读系统光标，比这里逐帧 IPC 更快；
     这条 IPC 在窗口被拖动时会被节流，正是"慢半拍"的来源。 */
  if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
  winDrag.moved = true;
  lookDrag = true;
  renderLook();           /* 摘皮肤：顶栏+输入条 display:none，布局瞬间少 63px */
  /* ★ 摘完皮肤必须让窗口立刻跟着缩一次，否则那 63px 只能由任务条承担 ——
     表现就是"一按住拖动，任务条往上跳一截"。缩完再上锁，拖动期间不再改。 */
  heightLocked = false;
  syncHeight(true);
  heightLocked = true;    /* 拖动期间别再自己改高度/位置，否则和鼠标抢窗口 */
});

window.addEventListener("mouseup", () => endDrag());

/* 中键按下后浏览器还会补一个 auxclick，别让它触发自动滚动 */
window.addEventListener("auxclick", (e) => {
  if (e.button === 1) e.preventDefault();
});

/* 窗口被夺焦点 / 切走时收尾，免得透明外观卡住不还原 */
window.addEventListener("blur", () => { endDrag(); setNativeLook(false); holdCollapsed = false; swipeLook(false); });

/* 主进程那一路：原生拖动开始 / 停下。
   桌面层里窗口是被主进程跟着光标搬的，页面收不到 mousemove，所以"开始拖了"
   "拖完了"这两个信号只能由主进程给 —— 本地手势状态也以它为准。 */
if (window.wgt && window.wgt.onDragLook) {
  window.wgt.onDragLook((p) => {
    const on = !!(p && p.on);
    setNativeLook(on);
    if (!on && winDrag) {
      clearTimeout(dragTimer);
      winDrag = null;
      lookDrag = false;
      document.body.classList.remove("drag-lock");
      heightLocked = false;
      renderLook();
      syncHeight(true);      /* 主进程那边已经收工，这次的高度/位置会被接受 */
    }
  });
}

/* ================= 增删改 ================= */
function add(text) {
  const t = String(text || "").trim();
  if (!t) return false;
  state.items.push({ id: uid(), text: t, done: false, at: Date.now() });
  if (state.view === "hist") state.view = "todo";   /* 在历史里添加，自动切回待办 */
  save();
  render();
  return true;
}

function toggle(id) {
  const t = state.items.find((x) => x.id === id);
  if (!t) return;
  t.done = !t.done;    /* 只改状态，不挪位置 —— 用户要求原地不动 */
  if (t.done) pushHist(t.text, "done");
  save();
  render();
}

function remove(id) {
  const i = state.items.findIndex((x) => x.id === id);
  if (i < 0) return;
  const [t] = state.items.splice(i, 1);
  pushHist(t.text, "del");
  save();
  render();
}

function clearDone() {
  const before = state.items.length;
  state.items.filter((t) => t.done).forEach((t) => pushHist(t.text, "del"));
  state.items = state.items.filter((t) => !t.done);
  if (state.items.length !== before) { save(); render(); }
}

/* 从历史里把一条放回待办（一律回到"未完成"，免得又被自动清掉） */
function restore(hid) {
  const i = state.hist.findIndex((x) => x.id === hid);
  if (i < 0) return;
  const [h] = state.hist.splice(i, 1);
  state.items.push({ id: uid(), text: h.text, done: false, at: Date.now() });
  save(); saveHist(); render();
}

function clearHist() {
  if (!state.hist.length) return;
  state.hist = [];
  saveHist(); render();
}

function setView(v) {
  if (state.view === v) return;
  state.view = v;
  $("list").scrollTop = 0;
  render();
}

/* ================= 外观：透明度 / 磨砂 =================
   半透明处垫的不是"真透明"，而是主进程裁过来的一块桌面快照（壁纸+图标）——
   桌面层里真透明只能透出壁纸，透不出图标（试过两条路都不行，见 backdrop.js）。
   于是磨砂 = 模糊这张快照，透明度 = 压在快照上的底色有多浓。 */
const LOOK = { alpha: 0.56, frost: 0, full: 0 };

function applyLook() {
  const r = document.documentElement.style;
  r.setProperty("--a", String(LOOK.alpha));
  r.setProperty("--frost", LOOK.frost + "px");
  /* 完全体：整张卡常驻。类变了布局和窗口形状都得跟着重算（applyFull 等
     是函数声明、已提升，这里直接调安全）。 */
  const was = document.body.classList.contains("fullmode");
  const now = !!LOOK.full;
  if (was !== now) {
    document.body.classList.toggle("fullmode", now);
    if (typeof applyFull === "function") {
      applyFull();
      applySolo();
      syncHeight(true);
      requestRegion();
    }
  }
}

function lookUI() {
  const ai = $("lkAlpha"), fi = $("lkFrost");
  if (!ai || !fi) return;
  ai.value = String(Math.round((1 - LOOK.alpha) * 100));
  fi.value = String(Math.round(LOOK.frost));
  $("lkAlphaV").textContent = ai.value + "%";
  $("lkFrostV").textContent = fi.value + "px";
  const fc = $("lkFull");
  if (fc) fc.checked = !!LOOK.full;
}

let lookSaveTimer = null;
function saveLookSoon() {
  clearTimeout(lookSaveTimer);
  lookSaveTimer = setTimeout(() => {
    if (window.wgt && window.wgt.setLook) window.wgt.setLook(LOOK);
  }, 220);
}

function bindLook() {
  lookUI();
  const ai = $("lkAlpha"), fi = $("lkFrost");
  if (!ai || !fi) return;
  ai.addEventListener("input", () => {
    LOOK.alpha = Math.min(0.95, Math.max(0.06, 1 - Number(ai.value) / 100));
    applyLook();
    $("lkAlphaV").textContent = ai.value + "%";
    saveLookSoon();
  });
  fi.addEventListener("input", () => {
    LOOK.frost = Math.min(20, Math.max(0, Number(fi.value) || 0));
    applyLook();
    $("lkFrostV").textContent = fi.value + "px";
    saveLookSoon();
  });
  const fc = $("lkFull");
  if (fc) fc.addEventListener("change", () => {
    LOOK.full = fc.checked ? 1 : 0;
    applyLook();
    saveLookSoon();
  });
}

/* 主进程裁好的快照：直接按"相对窗口"的 CSS px 铺在卡片最底下 */
function setBackdrop(p) {
  const bd = $("bd");
  if (!bd) return;
  if (window.wgt && window.wgt.onNoReg) {
    window.wgt.onNoReg((v) => document.body.classList.toggle("noreg", v));
  }

  if (!p || !p.url) { document.body.classList.remove("has-bd"); return; }
  bd.style.left = p.left + "px";
  bd.style.top = p.top + "px";
  bd.style.width = p.w + "px";
  bd.style.height = p.h + "px";
  bd.style.backgroundImage = "url(\"" + p.url + "\")";
  document.body.classList.add("has-bd");
}

/* 拖动实况（整幅快照方案）：起拖收到整幅快照，把它按屏幕坐标"钉死"在桌面
   上 —— #bd 的尺寸=整幅快照、位置=快照原点相对窗口的偏移，之后拖动 tick
   只更新 left/top。背景纹丝不动、窗口在上面滑，像素级对齐；对比旧的
   "每 70ms 重裁一块"，两次推送之间卡片动了背景没动，拖快了就错位。
   devicePixelRatio 已含页面 zoom，物理 px ÷ 它 = CSS px。 */
let bdFullImg = null;    /* { url, ox, oy, w, h } —— blob 缓存，一次拖动只解码一次 */
function placeBdFull(x, y) {
  if (!bdFullImg) return;
  const bd = $("bd");
  if (!bd) return;
  const s = window.devicePixelRatio || 1;
  bd.style.left = ((bdFullImg.ox - x) / s) + "px";
  bd.style.top = ((bdFullImg.oy - y) / s) + "px";
  bd.style.width = (bdFullImg.w / s) + "px";
  bd.style.height = (bdFullImg.h / s) + "px";
  bd.style.backgroundImage = "url(" + bdFullImg.url + ")";
  bd.style.backgroundSize = "100% 100%";
  document.body.classList.add("has-bd");
}
if (window.wgt.onBdFull) window.wgt.onBdFull((p) => {
  if (!p || !p.png) return;
  if (bdFullImg) { try { URL.revokeObjectURL(bdFullImg.url); } catch (e) { } }
  bdFullImg = {
    url: URL.createObjectURL(new Blob([p.png], { type: "image/png" })),
    ox: p.ox, oy: p.oy, w: p.w, h: p.h,
  };
});
if (window.wgt.onBdPos) window.wgt.onBdPos((p) => placeBdFull(p.x, p.y));
if (window.wgt.onBdDragEnd) window.wgt.onBdDragEnd(() => {
  /* 松手后主进程会推 patch 载荷，setBackdrop 重设 #bd —— 这里不用动。
     bdFullImg 特意不撤销：下回拖动直接复用，除非快照更新重发。 */
});

/* ================= 交互：添加 ================= */
const inp = $("inp");

/* solo 下输入框就是那一条待办，＋ 一直点得动（空着时等于"把光标放进输入框"）。
   否则一个灰掉的按钮摆在最显眼的位置，会让人以为坏了。 */
function syncAddBtn() {
  $("addBtn").disabled = !inp.value.trim() && !isSolo();
}

inp.addEventListener("input", () => {
  syncAddBtn();
});

/* 把输入框里的话收进待办。空着返回 false，不惊动任何人。
   v1.7.0：失焦、鼠标挪走也走这里 —— 用户的原话是"输入完一挪开它自己就加进去"。 */
let lastCommit = 0;
function commitInput() {
  const v = String(inp.value || "").trim();
  if (!v) return false;
  if (!add(v)) return false;
  inp.value = "";
  syncAddBtn();
  lastCommit = Date.now();
  return true;
}

inp.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    /* 加完就松手：光标留在输入框里，卡片会一直撑着展开态，
       可用户这时候想看的是"刚加进去的那一条"。 */
    if (commitInput()) inp.blur();
  } else if (e.key === "Escape") {
    /* 放弃这次输入：先清空再离开，否则一失焦又会被自动加进去 */
    inp.value = "";
    syncAddBtn();
    inp.blur();
  }
});

/* 离开输入框（点别处、点到别的窗口）→ 有内容就自动收进待办 */
inp.addEventListener("blur", () => { commitInput(); });

/* ================= 桌面层输入桥 =================
   卡片贴进桌面层后是 Progman 的子窗口，永远进不了前台输入队列 ——
   系统键盘（含输入法）一个字都到不了这里，输入框就成了摆设。
   主进程开了一个隐形"幽灵输入窗"代收（见 main.js「桌面层输入桥」）：
   输入框一拿焦点就报它的屏幕矩形，幽灵窗贴上去代打，文字实时镜像回来。
   普通窗口模式主进程会忽略请求，键盘走原生，两边不冲突。 */
let imeOn = false;
let imeTarget = null;
let imeEndAt = 0;   /* 上次收桥的时刻：幽灵窗隐藏会让卡片收到一次"假 mouseenter" */      /* "add" = 底部输入框；{ id, el } = 某条待办的行内编辑框 */

/* 开桥：报元素的屏幕矩形 + 现有文字，幽灵窗贴上去代收。
   底部输入框和"双击改字"渲染出来的行内输入框共用同一条桥 ——
   以前只接了底部输入框，所以双击改字在桌面层模式下根本打不进字
   （用户报的"双击不能编辑"，其实是一直没接上）。 */
function imeStart(el, target) {
  if (!window.wgt || !window.wgt.imeBegin || !el) return;
  imeOn = true;
  imeTarget = target;
  const r = el.getBoundingClientRect();
  window.wgt.imeBegin({ x: r.left, y: r.top, w: r.width, h: r.height, value: el.value });
}

/* 收桥。commit=true 把幽灵窗里的字落定（add → 收进待办；行内 → 写回那一条）。 */
function imeFinish(commit) {
  const tgt = imeTarget;
  imeTarget = null;
  const was = imeOn;
  imeOn = false;
  if (tgt && tgt !== "add") endEdit(commit, tgt.el);
  else if (commit) commitInput();
  /* ★ 底部输入框：收桥就把焦点放掉。否则 typing 一直为真 → wantFull() 永远成立 →
     加完一条之后点桌面，卡片再也不会变回"一条一条"的样子，光标还在那里闪
     （用户报的就是这个）。 */
  if (!tgt || tgt === "add") { try { inp.blur(); } catch (e) {} }
  if (was && window.wgt && window.wgt.imeEnd) window.wgt.imeEnd();
  imeEndAt = Date.now();
}

inp.addEventListener("focusin", () => { imeStart(inp, "add"); });

/* 行内编辑框也走同一条桥（focusin 会冒泡到 #rows） */
$("rows").addEventListener("focusin", (e) => {
  const el = e.target;
  if (!el || !el.classList || !el.classList.contains("etxt")) return;
  imeStart(el, { id: el.dataset.id, el: el });
});

if (window.wgt && window.wgt.onImeText) {
  window.wgt.onImeText((v) => {
    imeOn = true;
    const s = String(v == null ? "" : v);
    if (imeTarget && imeTarget !== "add") { imeTarget.el.value = s; return; }
    inp.value = s;
    syncAddBtn();
  });
  window.wgt.onImeCommit(() => { imeFinish(true); });   /* 收桥里已经会 blur */
  window.wgt.onImeCancel(() => {
    const tgt = imeTarget;
    if (tgt && tgt !== "add") { imeFinish(false); return; }   /* Esc = 放弃这次改动 */
    imeOn = false;
    imeTarget = null;
    inp.value = "";
    syncAddBtn();
    inp.blur();
    if (window.wgt.imeEnd) window.wgt.imeEnd();
  });
  window.wgt.onImeBlur(() => { imeFinish(true); });   /* 用户点去别处 = 提交 */
}

/* 桥开着的时候点卡片其他地方：直接收桥提交（输入框被幽灵窗盖着，
   点它根本到不了页面，能到这里就是点别处了） */
window.addEventListener("mousedown", (e) => {
  if (imeOn && !e.target.closest("input, .etxt")) imeFinish(true);
}, true);

$("addBtn").addEventListener("click", () => {
  /* 点 ＋ 的 mousedown 已经让输入框失焦、内容被自动收走了；
     紧接着这次 click 不要重复添加，也不要把光标抢回来 */
  if (Date.now() - lastCommit < 300) return;
  if (!commitInput()) inp.focus();      /* 空着点 ＋：等于"把光标放进输入框" */
});

/* ================= 交互：双击改成别的字 ================= */
const list = $("list");

function beginEdit(id) {
  if (state.view !== "todo") return false;
  markHintSeen();                  /* 已经会用双击了 */
  if (!state.items.some((x) => x.id === id)) return false;
  if (editId === id) return false;
  editId = id;
  render();
  return true;
}

/* commit=false 是 Esc：原样退出，不写盘。
   文字被清空也当作放弃 —— 想删请用垃圾桶或右滑，别让"清空"变成隐形删除。 */
function endEdit(commit, el) {
  const box = el || $("rows").querySelector(".etxt");
  const id = (box && box.dataset && box.dataset.id) || editId;
  const next = box ? String(box.value || "").trim() : "";
  const t = state.items.find((x) => x.id === id);
  if (commit && t && next && next !== t.text) { t.text = next; save(); }
  editId = null;
  render();
}

list.addEventListener("dblclick", (e) => {
  if (state.view !== "todo" || editId) return;
  if (e.target.closest(".chk") || e.target.closest(".del") || e.target.closest(".etxt")) return;
  const item = e.target.closest(".item");
  if (!item) return;
  beginEdit(item.dataset.id);
});

list.addEventListener("keydown", (e) => {
  const el = e.target;
  if (!el.classList || !el.classList.contains("etxt")) return;
  if (e.key === "Enter") { e.preventDefault(); endEdit(true, el); }
  else if (e.key === "Escape") { e.preventDefault(); endEdit(false, el); }
});

/* blur 不冒泡，用捕获接：点到别处 = 保存。
   注意先核 editId —— Enter/Esc 收尾时会把编辑框从 DOM 里摘掉，摘掉一个
   正握着焦点的元素会立刻甩出一个 blur，不挡住的话 Esc 就成了"确认保存"。 */
list.addEventListener("blur", (e) => {
  const el = e.target;
  if (!el.classList || !el.classList.contains("etxt")) return;
  if (editId !== el.dataset.id) return;
  /* ★ 桌面层模式下，幽灵输入窗拿走系统焦点会让这个框收到一次 blur ——
     那不是"用户离开了"，是输入桥接管了键盘。桥开着就不许它结束编辑，
     否则双击刚进编辑态、输入框就被拆掉，一个字都打不进去。 */
  if (imeTarget && imeTarget !== "add" && imeTarget.el === el) return;
  endEdit(true, el);
}, true);

/* ================= 交互：上下拖动排序 =================
   行内纵向拖动以前什么都不做（只认右滑），正好拿来做手动排序：
   按住任意一条上下拖，被拖的那条跟着光标走，其它行让位；松手落定。
   只动视觉，松手才改数据 —— 拖动过程中不重排 DOM，否则元素被重建、手势断掉。 */
function startReorder(d) {
  if (state.view !== "todo") return;
  d.mode = "reorder";
  d.rows = Array.prototype.slice.call(list.querySelectorAll("#rows .row"));
  d.from = d.rows.indexOf(d.row);
  if (d.from < 0) { d.mode = "pending"; return; }
  const a = d.rows[0].getBoundingClientRect();
  const b = d.rows[1] && d.rows[1].getBoundingClientRect();
  d.rowH = b ? Math.round(b.top - a.top) : Math.round(a.height) + 3;
  d.to = d.from;
  d.row.classList.add("moving");
  d.item.classList.add("dragging");
}

function moveReorder(d, e) {
  const dy = e.clientY - d.startY;
  const steps = Math.round(dy / (d.rowH || 33));
  const to = Math.max(0, Math.min(d.rows.length - 1, d.from + steps));
  d.to = to;
  d.row.style.transform = "translateY(" + dy + "px)";
  d.rows.forEach((r, i) => {
    if (r === d.row) return;
    if (to > d.from && i > d.from && i <= to) r.style.transform = "translateY(" + (-d.rowH) + "px)";
    else if (to < d.from && i >= to && i < d.from) r.style.transform = "translateY(" + d.rowH + "px)";
    else r.style.transform = "";
  });
}

function endReorder(d) {
  d.rows.forEach((r) => { r.style.transform = ""; r.style.zIndex = ""; });
  d.row.classList.remove("moving");
  d.item.classList.remove("dragging");
  if (d.to == null || d.to === d.from) return;
  const moved = state.items.splice(d.from, 1)[0];
  state.items.splice(d.to, 0, moved);
  save();
  render();
}

/* ================= 交互：完成 / 删除 / 右滑删除 =================
   条目只做三件事：单击勾选、双击改字、按住往右滑删除。
   挪窗口不在这里 —— 顶栏是标题栏（-webkit-app-region: drag），
   按住顶栏拖就跟资源管理器一样，光标全程是箭头。 */
let drag = null;            /* { item,row,id,startX,dx,moved } */
let suppressClick = false;  /* 刚滑完，紧接着的 click 要吞掉，别误标完成 */
let lastTap = { id: null, t: 0, x: 0, y: 0 };   /* 自己判双击用 */

const THRESHOLD = 82;   /* 滑过这个距离就删（约 1/3 卡宽） */

list.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  if (state.view !== "todo") return;
  if (editId) return;          /* 正在改字：这期间不要启动滑动手势 */
  const item = e.target.closest(".item");
  if (!item) return;

  /* 按住这一条 = 要操作它（勾选/右滑删除），这段时间卡片保持收起 */
  holdCollapsed = true;

  /* 点在勾选圈或垃圾桶上：走 click，不启动滑动手势 */
  if (e.target.closest(".chk") || e.target.closest(".del")) return;

  /* 双击进编辑 —— 这里自己判，不用原生 dblclick：
     下面那句 preventDefault（防止拖出文字选区）会把浏览器合成的 dblclick 一起挡掉。 */
  const now = Date.now();
  if (lastTap.id === item.dataset.id && now - lastTap.t < 420 &&
      Math.abs(e.clientX - lastTap.x) < 6 && Math.abs(e.clientY - lastTap.y) < 6) {
    lastTap = { id: null, t: 0, x: 0, y: 0 };
    e.preventDefault();
    beginEdit(item.dataset.id);
    return;
  }
  lastTap = { id: item.dataset.id, t: now, x: e.clientX, y: e.clientY };

  drag = {
    item: item,
    row: item.parentElement,
    id: item.dataset.id,
    startX: e.clientX,
    startY: e.clientY,
    mode: "pending",          /* pending | swipe | reorder */
    dx: 0,
    moved: false,
  };

  e.preventDefault();     /* 防止拖出文字选区 */
});

window.addEventListener("mousemove", (e) => {
  if (!drag) return;

  if (drag.mode === "pending") {
    const dx0 = e.clientX - drag.startX;
    const dy0 = e.clientY - drag.startY;
    /* 先判方向：横向往右 = 右滑删除；纵向 = 上下拖动排序。
       两轴都过阈值时看谁占优，避免斜着拖的时候乱跳模式。 */
    if (dx0 > 6 && Math.abs(dx0) >= Math.abs(dy0)) {
      drag.mode = "swipe";
      swipeLook(true);
    } else if (Math.abs(dy0) > 6) {
      startReorder(drag);
    } else return;
  }

  if (drag.mode === "reorder") { moveReorder(drag, e); return; }

  /* ---------- 右滑删除 ---------- */
  const dx = e.clientX - drag.startX;

  /* 只允许往右滑；往左给一点阻尼回弹感（不跟手） */
  const applied = dx > 0 ? dx : dx * 0.18;
  drag.dx = applied;

  if (Math.abs(dx) > 3) {
    if (!drag.moved) {
      drag.moved = true;
      drag.item.classList.add("dragging");
      drag.row.classList.add("drag-bg");   /* 一开始滑就露出红色删除底 */
    }
    drag.item.style.transform = "translateX(" + applied.toFixed(1) + "px)";
    drag.row.classList.toggle("armed", applied >= THRESHOLD);
  }
});

window.addEventListener("mouseup", () => {
  if (!drag) return;
  const d = drag;
  drag = null;
  holdCollapsed = false;
  swipeLook(false);

  d.item.classList.remove("dragging");

  if (d.mode === "reorder") { endReorder(d); return; }

  if (!d.moved) {                     /* 只是点了一下，交给 click 处理 */
    d.item.style.transform = "";
    return;
  }

  /* 滑动结束后的那次 click 一律吞掉（否则滑到勾选圈上会顺手标记完成） */
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 0);

  if (d.dx >= THRESHOLD) {
    /* 松手删除：先滑出去，再从数据里移除 */
    d.item.classList.add("removing");
    d.item.style.transform = "";
    setTimeout(() => remove(d.id), 190);
  } else {
    d.item.style.transform = "";      /* 没到阈值，弹回去 */
    d.row.classList.remove("armed", "drag-bg");
  }
});

list.addEventListener("click", (e) => {
  if (suppressClick) { e.stopPropagation(); e.preventDefault(); return; }

  if (state.view === "todo") {
    const chk = e.target.closest(".chk");
    if (chk) {
      const item = chk.closest(".item");
      if (item) toggle(item.dataset.id);
      return;
    }
    const del = e.target.closest(".del");
    if (del) {
      const item = del.closest(".item");
      if (item) {
        item.classList.add("removing");
        setTimeout(() => remove(item.dataset.id), 190);
      }
    }
    return;
  }

  const rest = e.target.closest(".rest");
  if (rest) {
    const row = rest.closest(".hrow");
    if (row) restore(row.dataset.hid);
    return;
  }
  const clr = e.target.closest(".hclear");
  if (clr) {
    /* 危险操作两段确认：3 秒内再点一次才真清 */
    if (clearArm && Date.now() - clearArm < 3000) { clearArm = 0; clearHist(); return; }
    clearArm = Date.now();
    clr.textContent = "再点一次确认清空";
    setTimeout(() => { clearArm = 0; if (state.view === "hist") renderList(); }, 3200);
  }
}, true);

/* ================= 视图切换 / 页脚 / 菜单 / 关闭 ================= */
$("histBtn").addEventListener("click", () => setView(state.view === "hist" ? "todo" : "hist"));

/* 返回：整条页脚都能点（不止右边那几个字），热区再向外扩 6px。
   历史 / 外观视图下才生效，待办视图里页脚只是提示文字。 */
$("ft").addEventListener("click", () => {
  if (state.view !== "todo") setView("todo");
});

$("menuBtn").addEventListener("click", () => { if (window.wgt) window.wgt.menu(); });
$("closeBtn").addEventListener("click", () => { if (window.wgt) window.wgt.close(); else window.close(); });

document.addEventListener("contextmenu", (e) => {
  /* 输入框里保留系统右键菜单，方便粘贴 */
  if (e.target.closest("input")) return;
  e.preventDefault();
  if (window.wgt) window.wgt.menu();
});

if (window.wgt) {
  window.wgt.onFocusInput(() => {
    if (state.view === "hist") setView("todo");
    /* 收起时输入框是 display:none，直接 focus() 没用：先展开、下一拍再聚焦。
       聚焦失败就把 typing 退回去，免得卡片永远收不回来。 */
    typing = true;
    if (applyFull()) syncHeight(true);
    setTimeout(() => {
      inp.focus();
      inp.select();
      if (document.activeElement !== inp) {
        typing = false;
        if (applyFull()) syncHeight(true);
      }
    }, 40);
  });
  window.wgt.onClearDone(() => clearDone());
  if (window.wgt.onShowHistory) window.wgt.onShowHistory(() => setView(state.view === "hist" ? "todo" : "hist"));
  if (window.wgt.onShowLook) window.wgt.onShowLook(() => setView(state.view === "look" ? "todo" : "look"));
  /* 右键菜单勾选「完全体」：和外观面板里的勾选框共用 LOOK.full 一份状态 */
  if (window.wgt.onSetFullmode) window.wgt.onSetFullmode((on) => {
    LOOK.full = on ? 1 : 0;
    applyLook();
    saveLookSoon();
    if (state.view === "look") lookUI();
  });

  /* 桌面快照背景：主进程推的（拖动 / 伸缩之后）和主动要的（首次加载）都走这里 */
  if (window.wgt.onBackdrop) window.wgt.onBackdrop(setBackdrop);
  if (window.wgt.backdropNow) window.wgt.backdropNow().then(setBackdrop).catch(() => {});

  /* 外观设置：读回上次的值 */
  if (window.wgt.getLook) {
    window.wgt.getLook().then((v) => {
      if (!v) return;
      if (Number.isFinite(v.alpha)) LOOK.alpha = Math.min(0.95, Math.max(0.06, v.alpha));
      if (Number.isFinite(v.frost)) LOOK.frost = Math.min(20, Math.max(0, v.frost));
      LOOK.full = v.full ? 1 : 0;
      applyLook();
      if (state.view === "look") { renderList(); syncHeight(true); }
    }).catch(() => {});
  }
}

/* ================= 启动 ================= */
document.body.classList.add(window.wgt && window.wgt.acrylic ? "acrylic" : "solid");
load();
render();
requestRegion();
window.addEventListener("resize", requestRegion);

/* 字体加载完高度会变一点，再校一次 */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastH = 0; syncHeight(); });
</script>
</body>
